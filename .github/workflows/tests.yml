name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # The iOS-port umbrella branch and its stacked sub-branches get CI too.
    branches: [main, 'claude/icloud-sync-strategy-ios-737urc*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
  workflow_dispatch:

# PR runs replace each other; every push to main keeps its own run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    # The project file needs Xcode 27 (objectVersion 90), which the plain
    # macos-26 image does not ship (Xcode 26.x only).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            XCODE=/Applications/Xcode.app
          fi
          if ! "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version | grep -q '^Xcode 27'; then
            echo "::error::No Xcode 27 found on this runner (looked at /Applications/Xcode_27*.app and Xcode.app)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Timelane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Timelane.xcodeproj \
            -scheme Timelane \
            -derivedDataPath build/DerivedData \
            -skipPackagePluginValidation \
            -skipMacroValidation

      # Ad-hoc signing: the owner's team does not exist on the runner, but the
      # hosted tests still need a signed (sandboxed) Timelane.app.
      # CODE_SIGN_ENTITLEMENTS= (empty) strips the iCloud entitlements: an ad-hoc app
      # that claims them is killed at launch. Tests never create a CKContainer.
      - name: Build and test
        run: |
          xcodebuild test \
            -project Timelane.xcodeproj \
            -scheme Timelane \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: build/TestResults.xcresult
          retention-days: 7

  # The target is multiplatform: every file in Timelane/ also compiles for iOS (macOS-only code is guarded
  # with #if os(macOS)). This job only builds; the tests stay on macOS.
  ios-build:
    name: iOS build
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then
            XCODE=/Applications/Xcode.app
          fi
          if ! "$XCODE/Contents/Developer/usr/bin/xcodebuild" -version | grep -q '^Xcode 27'; then
            echo "::error::No Xcode 27 found on this runner (looked at /Applications/Xcode_27*.app and Xcode.app)"
            exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: build/DerivedData-iOS/SourcePackages
          key: spm-ios-${{ runner.os }}-${{ hashFiles('Timelane.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-ios-${{ runner.os }}-

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Timelane.xcodeproj \
            -scheme Timelane \
            -derivedDataPath build/DerivedData-iOS \
            -skipPackagePluginValidation \
            -skipMacroValidation

      # No signing: the runner has neither the owner's team nor the iCloud entitlements.
      # CODE_SIGN_ENTITLEMENTS= (empty) also overrides the SDK-conditional entitlements settings.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Timelane.xcodeproj \
            -scheme Timelane \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData-iOS \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=
